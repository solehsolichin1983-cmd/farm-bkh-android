name: Build FARM BKH APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk FARM_BKH_ANDROID_V1.0a.apk

      - name: Verify APK
        run: |
          test -f FARM_BKH_ANDROID_V1.0a.apk
          ls -lh FARM_BKH_ANDROID_V1.0a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FARM_BKH_ANDROID_V1.0a_APK
          path: FARM_BKH_ANDROID_V1.0a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0a
          name: FARM BKH Android V1.0a
          body: |
            FARM BKH Android V1.0a - Web GAS Mobile App
            Built automatically by GitHub Actions.
          files: FARM_BKH_ANDROID_V1.0a.apk
          draft: false
          prerelease: false
